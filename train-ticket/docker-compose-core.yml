services:
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - my-network

  # Lightweight stub providing DNS aliases for optional non-core services
  # to satisfy ts-ui-dashboard's Nginx upstream resolution without burning RAM
  ts-stub:
    image: nginx:alpine
    restart: always
    networks:
      my-network:
        aliases:
          - ts-admin-basic-info-service
          - ts-admin-order-service
          - ts-admin-route-service
          - ts-admin-travel-service
          - ts-admin-user-service
          - ts-assurance-service
          - ts-avatar-service
          - ts-cancel-service
          - ts-consign-service
          - ts-execute-service
          - ts-food-service
          - ts-inside-payment-service
          - ts-news-service
          - ts-notification-service
          - ts-order-other-service
          - ts-payment-service
          - ts-preserve-other-service
          - ts-preserve-service
          - ts-rebook-service
          - ts-route-plan-service
          - ts-security-service
          - ts-ticket-office-service
          - ts-travel-plan-service
          - ts-voucher-service

  ts-ui-dashboard:
    image: nginx:alpine
    restart: always
    ports:
      - "8088:8080"
    volumes:
      - ./ts-ui-dashboard/nginx-alpine.conf:/etc/nginx/nginx.conf:ro
      - ./ts-ui-dashboard/static:/usr/share/nginx/html:ro
    networks:
      - my-network
    depends_on:
      - ts-stub

  ts-auth-service:
    image: ${IMG_REPO:-codewisdom}/ts-auth-service:${IMG_TAG:-0.2.0}
    restart: always
    ports:
      - "12340:12340"
    networks:
      - my-network
    depends_on:
      - ts-auth-mongo

  ts-auth-mongo:
    image: mongo:4.4
    restart: always
    networks:
      - my-network

  ts-user-service:
    image: ${IMG_REPO:-codewisdom}/ts-user-service:${IMG_TAG:-0.2.0}
    restart: always
    ports:
      - "12342:12342"
    networks:
      - my-network
    depends_on:
      - ts-user-mongo

  ts-user-mongo:
    image: mongo:4.4
    restart: always
    networks:
      - my-network

  ts-verification-code-service:
    image: ${IMG_REPO:-codewisdom}/ts-verification-code-service:${IMG_TAG:-0.2.0}
    restart: always
